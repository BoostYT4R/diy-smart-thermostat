    id: font_temp
    size: 170
    bpp: 4
    glyphs: "0123456789"
  - file: "gfonts://Roboto@500"
    id: font_set
    size: 84
    bpp: 4
    glyphs: "0123456789"
  - file: "gfonts://Outfit@600"     # clock: clean geometric, semi-bold
    id: font_clock
    size: 132
    bpp: 4
    glyphs: "0123456789: "
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_s
    size: 36
    bpp: 4
    glyphs: ["\U000F0599", "\U000F0594", "\U000F0595", "\U000F0590", "\U000F0597", "\U000F0596",
             "\U000F0598", "\U000F0591", "\U000F0593", "\U000F059D", "\U000F0592",
             "\U000F058E", "\U000F012A", "\U000F004D",
             "\U000F091F", "\U000F0922", "\U000F0925", "\U000F0928", "\U000F05AA",
             "\U000F0425", "\U000F0238", "\U000F0717", "\U000F0210", "\U000F0F2F",
             "\U000F0F19", "\U000F03D8", "\U000F0AB0", "\U000F0BA3", "\U000F171B", "\U000F0405",
