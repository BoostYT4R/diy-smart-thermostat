        - obj: { id: filter_bar, x: 300, y: 456, width: 4, height: 10, radius: 5, bg_color: 0x34C759, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false, clickable: false }
        - label: { id: lbl_filter, x: 300, y: 426, width: 190, text: "--", text_font: montserrat_20, text_color: 0x34C759 }
