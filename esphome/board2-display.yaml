# Board 2 - Thermostat touchscreen v2 (Waveshare ESP32-S3-Touch-LCD-7, 800x480)
# Pages: HOME (Vine style, odometer numbers) / STANDBY (clock, weather + 3-day forecast, set temp) / HISTORY (graphs + heat cost)
# v3.3 - independent heat / cool setpoints (heat can be above cool)
# v3.4 - whole-house PG&E electric bill on the Energy page (Opower integration)
# v3.5 - standby: strong animated heat / cool glow + rising embers / cool air streaks while running
#
# BEFORE BUILDING: fill in the 4 entity IDs under "substitutions" (see notes) and your WiFi password.
# In Home Assistant: ESPHome -> Thermostat Display -> Configure ->
#   turn ON "Allow the device to perform Home Assistant actions"

substitutions:
  thermostat: climate.garage_hall_thermostat_thermostat
  room_humidity: sensor.garage_hall_thermostat_room_humidity
  govee_temp: sensor.stair_hall_h5075_d5cb_temperature
  govee_humidity: sensor.stair_hall_h5075_d5cb_humidity
  weather: weather.forecast_home                               # from the Met.no integration
  forecast: sensor.display_forecast                            # from display_forecast.yaml (HA package)
  forecast7: sensor.display_forecast_7_day                     # from display_forecast.yaml (HA package)
  cost_today: sensor.heat_cost_today                           # from heat_cost.yaml
  cost_week: sensor.heat_cost_this_week
  # Board 1 settings (created by board1-thermostat.yaml)
  t_source: select.garage_hall_thermostat_temperature_source
  pre_switch: switch.garage_hall_thermostat_smart_pre_heat
  pre_time: time.garage_hall_thermostat_pre_heat_ready_by
  pre_temp: number.garage_hall_thermostat_pre_heat_ready_temperature
  pre_status: sensor.garage_hall_thermostat_pre_heat_status
  fan_after: number.garage_hall_thermostat_fan_run_after_cycle
  heat_rate: sensor.garage_hall_thermostat_learned_heat_rate
  safety: sensor.garage_hall_thermostat_safety_status
  # Speedtest.net integration in Home Assistant (Settings > Devices & services > Add > Speedtest.net)
  speed_down: sensor.speedtest_download
  speed_up: sensor.speedtest_upload
  speed_ping: sensor.speedtest_ping
  # cost / energy (heat_cost.yaml) + filter (Board 1)
  cost_month: sensor.heat_cost_this_month
  heat_sp: number.garage_hall_thermostat_heat_setpoint
  cool_sp: number.garage_hall_thermostat_cool_setpoint
  ac_today: sensor.cool_cost_today
  ac_week: sensor.cool_cost_this_week
  ac_month: sensor.cool_cost_this_month
  cost_last: sensor.energy_cost_last_month
  # Whole house electric bill from PG&E (Opower integration, ~1-2 days behind)
  house_cost: sensor.elec_account_XXXXXXXXXX_current_bill_electric_cost_to_date
  house_fcst: sensor.elec_account_XXXXXXXXXX_current_bill_electric_forecasted_cost
  house_typ: sensor.elec_account_XXXXXXXXXX_typical_monthly_electric_cost
  heat_h_today: sensor.heat_hours_today
  cool_h_today: sensor.cool_hours_today
  hvac_hist: sensor.hvac_daily_history
  filter_left: sensor.garage_hall_thermostat_filter_life_left
  filter_reset: button.garage_hall_thermostat_filter_replaced

esphome:
  name: thermostat-display
  friendly_name: Thermostat Display
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Build the graph dots/bars once (cheap small objects, moved later instead of recreated)
          // Square, non-clickable objects: much cheaper to draw than anti-aliased circles
          auto mk = [](lv_obj_t *p, uint32_t c, int w, int h) -> lv_obj_t * {
            lv_obj_t *o = lv_obj_create(p);
            lv_obj_remove_style_all(o);
          #if LVGL_VERSION_MAJOR >= 9
            lv_obj_remove_flag(o, (lv_obj_flag_t) (LV_OBJ_FLAG_CLICKABLE | LV_OBJ_FLAG_SCROLLABLE));
          #else
            lv_obj_clear_flag(o, LV_OBJ_FLAG_CLICKABLE | LV_OBJ_FLAG_SCROLLABLE);
          #endif
            lv_obj_set_size(o, w, h);
            lv_obj_set_style_bg_color(o, lv_color_hex(c), 0);
            lv_obj_set_style_bg_opa(o, LV_OPA_TRANSP, 0);
            return o;
          };
          for (int i = 0; i < 48; i++) {
            id(dots_rt).push_back(mk(id(chart_t), 0xFFFFFF, 5, 5));
            id(dots_gt).push_back(mk(id(chart_t), 0x34C759, 5, 5));
            id(dots_rh).push_back(mk(id(chart_h), 0x4DA3FF, 5, 5));
            id(dots_gh).push_back(mk(id(chart_h), 0x34C759, 5, 5));
            id(bars_heat).push_back(mk(id(chart_r), 0xFF7A1A, 11, 0));
            id(bars_cool).push_back(mk(id(chart_r), 0x4DA3FF, 11, 0));
          }
      - script.execute: draw_charts
      - script.execute: update_setpoints
      - script.execute: update_clock

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # Free up internal RAM so WiFi can start (the screen uses a lot of it)
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "6"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN          # less logging = more CPU for drawing

api:
  reboot_timeout: 0s   # don't reboot while the NAS is off at night
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # use_address: 192.168.1.x   # optional: set if you reserve a fixed IP on your router
  ap:
    ssid: "Thermostat Display Fallback"
    password: !secret fallback_password

captive_portal:

# ---------------- Hardware ----------------
i2c:
  sda: 8
  scl: 9
  frequency: 400kHz

ch422g:
  - id: ch422g_hub

# backlight + LCD reset are handled by the display model preset (CH422G pins 2 and 3)

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: my_touch
    interrupt_pin: 4
    reset_pin:
      ch422g: ch422g_hub
      number: 1

time:
  - platform: homeassistant
    id: ha_time
    timezone: America/Los_Angeles     # don't rely on Home Assistant's time zone setting
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

# ---------------- Fonts (only the characters we use = small + fast) ----------------
font:
