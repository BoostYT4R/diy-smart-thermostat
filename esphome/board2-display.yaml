        - button:
            id: btn_filter
            x: 506
            y: 426
            width: 274
            height: 50
            radius: 14
            bg_color: 0x161616
            border_width: 0
            shadow_width: 0
            pad_all: 0
            clip_corner: true
            widgets:
              - obj: { id: filter_fill, x: 0, y: 0, width: 0, height: 50, radius: 0, bg_color: 0x1F8A3B, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false, clickable: false }
              - label: { id: lbl_filter_btn, align: CENTER, text: "Hold: new filter put in", text_font: montserrat_20, text_color: 0xFFFFFF }
            on_press:
              - lambda: |-
                  #if LVGL_VERSION_MAJOR >= 9
                  #define TSTAT_ANIM_DEL lv_anim_delete
                  #else
                  #define TSTAT_ANIM_DEL lv_anim_del
                  #endif
                  TSTAT_ANIM_DEL(id(filter_fill), NULL);
                  lv_anim_t a;
                  lv_anim_init(&a);
                  lv_anim_set_var(&a, id(filter_fill));
                  lv_anim_set_exec_cb(&a, [](void *o, int32_t w) { lv_obj_set_width((lv_obj_t *) o, w); });
                  lv_anim_set_values(&a, 0, 274);
                  #if LVGL_VERSION_MAJOR >= 9
                  lv_anim_set_duration(&a, 2000);
                  #else
                  lv_anim_set_time(&a, 2000);
                  #endif
                  lv_anim_set_ready_cb(&a, [](lv_anim_t *) { id(filter_reset_go).execute(); });
                  lv_anim_start(&a);
            on_release:
              - lambda: |-
                  // let go early = cancel
                  if (lv_obj_get_width(id(filter_fill)) < 274) {
                  #if LVGL_VERSION_MAJOR >= 9
                    lv_anim_delete(id(filter_fill), NULL);
                  #else
                    lv_anim_del(id(filter_fill), NULL);
                  #endif
                    lv_obj_set_width(id(filter_fill), 0);
                  }

